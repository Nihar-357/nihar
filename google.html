<!DOCTYPE html>
<html>
  <head>
    <title>Googol</title>
    <style>
      div{
        text-align: center;
      }
        .google-logo{
            width:350px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .search{
          box-shadow:0 0 6px rgba(0, 0, 0, 0.2) ;
          border:none;
          padding-top: 12px;
          padding-bottom: 12px;
          padding-left: 16px;
          padding-right: 16px;
          font-size: 16px;
          width:500px;
          border-radius: 25px;
          margin-bottom: 30px;

        }
        .google-button1,
        .google-button2{
          font-size: 15px;
          padding-top: 12px;
          padding-bottom: 12px;
          padding-left: 20px;
          padding-right: 20px;
          font-weight: lighter;
          border:none;
          display:inline-block;
        }
    </style>
  </head>
  <body>
      <div>
          <img class="google-logo" src="googol.jpg" alt="hello">
          <div>
            <input class="search" type="text" placeholder="Search Google or type a URL">
          </div>
          <div>
            <button class="google-button1">Google Search</button>
            <button class="google-button2">I'm Feeling Lucky</button>
          </div>
      </div>
  </body>
</html>
